# Builds the knowledge graph from the raw data and runs every check on each push and pull request.
# Nothing here needs secrets: the app runs offline (FKG_OFFLINE=1) and the agent tests never call Groq.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FKG_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Get the dataset
        run: python scripts/get_data.py

      - name: Build graph + app database
        run: |
          python src/build_kg.py
          python -m server.build_db

      - name: Backend tests
        run: python -m pytest -q

      - name: UI typecheck, unit tests, build
        working-directory: web
        run: |
          npm ci
          npm run check
